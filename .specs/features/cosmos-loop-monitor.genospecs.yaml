name: cosmos-loop-monitor
description: >
  A production OpenC3 COSMOS-based manager for geno-loops agents running on z2
  (remote-host). Each autonomous agent (a workspace session running a loop) is
  modeled as a COSMOS TARGET — the idiomatic COSMOS shape: a thing you
  telemeter and command. Because COSMOS targets are static at plugin-build
  time, we pre-declare a pool of agent targets AGENT_01..AGENT_32, each with a
  rich telemetry packet (loop state, runtime/resources, work output, project
  linkage). A host-side sidecar on z2 sees real host processes, tmux sessions,
  and the vault, binds each live agent session to a free agent target, and
  pushes telemetry via the COSMOS inject_tlm API. Per-item LIMITS give
  automatic alerting (e.g. CONTEXT_PCT > 90 → YELLOW, AGE_MINUTES > 120 → RED).
  Phase 2 adds commanding (START/STOP/STEER) routed through the same sidecar.
  The COSMOS demo plugin has been removed so only geno-loops data shows.

status: active

# ── Architecture decisions (locked with the user) ──────────────────────────
# AGENT = TARGET. An autonomous loop-running agent maps to a COSMOS target:
#   live telemetry (runtime, context%, iteration, phase) + commandable
#   (start/stop/steer). This is more COSMOS-native than a custom tool or a
#   single-target/slot-pool packet hack.
#
# CONSTRAINT (verified 2026-05-29): COSMOS Core 7.1.1 does NOT create targets
#   or packet structures at runtime. create_target / set_tlm_packet are not
#   public API; targets+packets are static at plugin install. inject_tlm exists
#   but only fills a PRE-EXISTING packet structure. Docs confirm static-only.
#
# THEREFORE: PRE-DECLARED AGENT TARGET POOL. The plugin statically declares
#   AGENT_01..AGENT_32 (real targets, each with the full item schema). The
#   sidecar binds a live session to a free agent target (by session name) and
#   injects its telemetry. Cap is tunable (32 ≈ ~21 current + headroom). When
#   an agent dies its target frees; COSMOS data store preserves the history.
#   Unlike the rejected slot-pool, each agent is a FIRST-CLASS target with its
#   own packet, screen, limits, and (Phase 2) command set.
#
# COLLECTOR = HOST-SIDE SIDECAR (not an in-container microservice). Containers
#   are blind to host procs/tmux — that caused CLAUDE_PROCS=0 / all-DEAD. The
#   sidecar runs on the host, owns a binding map (session→agent target) in
#   sqlite, pushes telemetry, and is the executor for Phase-2 commands.

goals:
  - Pre-declared agent target pool AGENT_01..AGENT_32 in the plugin, each a real COSMOS target with the full per-agent telemetry packet
  - Host-side sidecar on z2 that reads host procs + tmux + vault, binds live sessions to free agent targets (stable session→target map in sqlite), and pushes telemetry via inject_tlm
  - Correct liveness — real claude process count and per-agent ALIVE/age (fixes the in-container CLAUDE_PROCS=0 / all-DEAD bug)
  - Rich per-agent items across four groups (loop state, runtime/resources, work output, project linkage) with per-item LIMITS for automatic alerting
  - An aggregate FLEET target/packet (totals — agents alive/stale/dead, host claude_procs) for fleet-health limits, alerting, and history
  - Per-agent Telemetry Viewer screens + a fleet overview screen shipped in the plugin
  - Sidecar supervised durably on z2 (systemd user unit) — restarts on failure, survives reconnects
  - Phase 2 — COSMOS commands START_AGENT / STOP_AGENT / STEER_AGENT per agent target, routed to the sidecar executor (tmux send-keys / SIGTERM / vault inbox note)
  - Demo removed (done operationally) and re-documented as a reproducible runtime uninstall; strong OPENC3_API_PASSWORD; 0.0.0.0+HTTP + SSH-tunnel documented

architecture:
  host: z2 (remote-host) — Docker 29.4.2 + Compose v5.1.3, 250Gi RAM
  cosmos: OpenC3 COSMOS Core 7.1.1 (docker compose), ~/openc3, http://remote-host:2900 (0.0.0.0, OPENC3_ALLOW_HTTP=1)
  plugin_dir: ~/geno-loops-cosmos
  vault_root: /home/eriveraramos/geno-vault
  vault_layout: "<PROJECT>/[<session>/]iterations/YYYY-MM-DDTHHMM-iter-NNN.md"

  agent_target_pool:
    targets: AGENT_01 .. AGENT_32   # static in plugin; tunable count
    binding: "sidecar maps session_name → AGENT_NN, persisted in sqlite so an agent keeps its target across polls; freed on death; OCCUPIED item flags live vs free"
    per_agent_packet_items:
      core_loop_state: [ITERATION, PHASE, AGE_MINUTES, ALIVE]          # PHASE: planning|implementing|testing|merging|idle
      runtime_resources: [RUNTIME_SEC, CONTEXT_PCT, TOKENS, MODEL]
      work_output: [COMMITS, TESTS_PASS, TESTS_FAIL, LAST_COMMIT_SHA, FF_MERGES]
      project_linkage: [PROJECT, SESSION, WORKTREE, SPEC]
      binding_meta: [OCCUPIED, LAST_SEEN]
    limits:
      AGE_MINUTES: "YELLOW HIGH 20, RED HIGH 120"
      CONTEXT_PCT:  "YELLOW HIGH 80, RED HIGH 92"
      TESTS_FAIL:   "RED HIGH 1 (any failing test alerts)"

  fleet_target:
    target: GENO_LOOPS
    packet: FLEET
    items: [AGENTS_TOTAL, AGENTS_ALIVE, AGENTS_STALE, AGENTS_DEAD, CLAUDE_PROCS, TIMESTAMP]
    purpose: aggregate fleet-health alerting/history (e.g. AGENTS_DEAD RED HIGH 1)

  sidecar:
    type: host-side service on z2 (systemd user unit), NOT a container
    reads: "ps (claude procs + cwd), tmux session names via ps grep, vault iterations, per-repo ITERATION_LOG.md/git"
    derives: "context% and runtime from the agent's claude proc + session start; iteration/phase from vault + git; commits/tests from git log + repo state"
    state: "sqlite — session→AGENT_NN binding map + last-known per-agent values"
    pushes: "inject_tlm to COSMOS (auth: POST /openc3-api/auth/verify → raw ses_ token as Authorization header)"
    executes: "Phase-2 commands via tmux send-keys / SIGTERM to the agent's claude pid / vault inbox note"

  constraints:
    - NEVER use tmux introspection (capture-pane/list-sessions/display-message) — crashes z2's tmux. Infer sessions from `ps aux | grep '[t]mux'`; drive only via new-session/send-keys.
    - The sidecar runs on the host; never sshes into itself. COSMOS containers never try to read host procs.
    - COSMOS cannot create targets/packets at runtime — the agent pool MUST be statically declared in the plugin; changing the item schema or pool size requires a plugin rebuild+reload.
    - Open-source COSMOS has one shared password and no multi-user auth; 0.0.0.0+HTTP exposes view AND command to the corp network. Strong OPENC3_API_PASSWORD mandatory; SSH-tunnel documented as the safer path.

technologies:
  - OpenC3 COSMOS Core 7.1.1 (docker compose)
  - python 3 (sidecar: collectors, sqlite binding store, COSMOS API client, command executor)
  - COSMOS JSON-RPC API (inject_tlm; auth/verify)
  - systemd user unit (sidecar supervision)
  - pytest (parsers, binding/assignment logic, telemetry mapping)

