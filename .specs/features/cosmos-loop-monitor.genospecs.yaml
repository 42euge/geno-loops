name: cosmos-loop-monitor
description: >
  A production OpenC3 COSMOS-based manager for geno-loops running on z2
  (remote-host). Phase 1 delivers real-time monitoring: a host-side sidecar
  collector sees host processes, tmux sessions, and the vault directly, and
  PUSHES telemetry into COSMOS over its API. Each running loop occupies a
  stable slot in a pre-sized slot pool so the whole fleet is visible at once
  in a dedicated GENO_LOOPS Telemetry Viewer screen with per-loop limits
  coloring. Phase 2 adds management: COSMOS commands (START/STOP/STEER) handled
  by the same sidecar, which executes them on the host via tmux/ssh/vault.
  The COSMOS demo targets (INST/INST2/EXAMPLE/TEMPLATED) are removed so the UI
  shows only geno-loops data.

status: active

# ── Architecture decisions (locked with the user) ──────────────────────────
# 1. COLLECTOR = HOST-SIDE SIDECAR, not a COSMOS in-container microservice.
#    Rationale: COSMOS runs in Docker containers blind to host processes/tmux.
#    The earlier in-container microservice is why CLAUDE_PROCS=0 and every loop
#    showed DEAD. A host-side service on z2 sees /proc, tmux, and the vault
#    directly, PUSHES telemetry to COSMOS via the JSON API, and is ALSO the
#    bridge that executes Phase-2 control commands. One component, both phases.
# 2. FLEET MODEL = PRE-SIZED SLOT POOL. COSMOS packets are static at build
#    time but loops are dynamic (~21 now, names change, some die/spawn).
#    Define LOOP_SLOT_1..LOOP_SLOT_32; the sidecar assigns each discovered loop
#    a stable slot keyed by session name. Shows all loops at once. 32 = ~21 +
#    headroom. The single overwrite-prone LOOP packet is replaced.
# 3. PHASED: Phase 1 monitoring (this spec's primary goal); Phase 2 control
#    (commands) built on the same sidecar once monitoring is solid.

goals:
  - Host-side sidecar collector on z2 that reads host procs + tmux + vault and pushes telemetry to COSMOS over its JSON API (no in-container process blindness)
  - CLAUDE_PROCS reflects the real host process count and per-loop ALIVE/age is correct (fixes the all-DEAD bug)
  - Pre-sized LOOP_SLOT_1..32 packet pool so the entire fleet is visible simultaneously, each loop pinned to a stable slot by session name
  - A dedicated GENO_LOOPS Telemetry Viewer screen — fleet summary header plus per-loop rows with AGE_MINUTES limits coloring (YELLOW >20m, RED >120m)
  - COSMOS demo targets (INST, INST2, EXAMPLE, TEMPLATED) removed so only GENO_LOOPS telemetry shows
  - Sidecar runs durably on z2 (systemd unit or supervised tmux) and survives reconnects
  - Phase 2 — COSMOS commands START_LOOP / STOP_LOOP / STEER_LOOP routed to the sidecar, which executes via tmux send-keys / vault inbox notes (NEVER tmux introspection)
  - A strong OPENC3_API_PASSWORD; 0.0.0.0 bind + OPENC3_ALLOW_HTTP documented with the SSH-tunnel alternative

architecture:
  host: z2 (remote-host) — Docker 29.4.2 + Compose v5.1.3, 250Gi RAM
  cosmos_install_dir: ~/openc3 (OpenC3 COSMOS Core 7.1.1, docker compose)
  plugin_dir: ~/geno-loops-cosmos
  web: bound 0.0.0.0:2900, OPENC3_ALLOW_HTTP=1 set (CSP allows http origin) — http://remote-host:2900
  vault_root: /home/eriveraramos/geno-vault
  vault_layout: "<PROJECT>/[<session>/]iterations/YYYY-MM-DDTHHMM-iter-NNN.md"
  collector:
    type: host-side sidecar (runs ON z2 host, NOT in a container)
    reads: "ps (claude procs), tmux session names via ps grep, vault iteration files, per-repo ITERATION_LOG.md"
    pushes: "telemetry to COSMOS via POST /openc3-api/api (auth via /openc3-api/auth/verify → Authorization header)"
    supervision: systemd user unit (preferred) or supervised tmux session
  fleet_model:
    scheme: pre-sized slot pool
    packets:
      FLEET: "CLAUDE_PROCS, LOOPS_TOTAL, LOOPS_STALE, LOOPS_DEAD, TIMESTAMP"
      LOOP_SLOT_1..32: "SLOT_INDEX, LOOP_NAME, PROJECT, SESSION, ITER_COUNT, LATEST_ITER, AGE_MINUTES (LIMITS YELLOW>20 RED>120), ALIVE, LAST_SEEN, OCCUPIED(0/1)"
    slot_assignment: "stable map session_name → slot index, persisted by the sidecar so a loop keeps its slot across polls; unoccupied slots report OCCUPIED=0"
  screen:
    tool: COSMOS Telemetry Viewer screen definition shipped in the plugin (targets/GENO_LOOPS/screens/)
    layout: "fleet summary row (totals/stale/dead/procs) above a table of occupied LOOP_SLOT rows with limits coloring"
  phase2_control:
    commands: "START_LOOP(project, spec), STOP_LOOP(session), STEER_LOOP(session, note)"
    executor: "the same sidecar — START via tmux new-session+send-keys, STOP via SIGTERM to the loop's claude pid, STEER via writing a vault inbox note"
  constraints:
    - NEVER use tmux introspection (capture-pane/list-sessions/display-message) — crashes z2's tmux. Infer sessions from `ps aux | grep '[t]mux'`; drive only via new-session/send-keys.
    - The sidecar runs on the host; it does NOT ssh into itself. COSMOS containers never try to see host procs.
    - Open-source COSMOS has a single shared password and no multi-user auth; 0.0.0.0 + HTTP exposes view AND command to the corp network. Strong OPENC3_API_PASSWORD mandatory; SSH-tunnel documented as the safer path.

technologies:
  - OpenC3 COSMOS Core 7.1.1 (docker compose)
  - python 3 (sidecar collector + control executor)
  - COSMOS JSON-RPC API (inject_tlm / set_tlm; auth/verify)
  - systemd user unit (sidecar supervision)
  - pytest (unit tests for parsers + slot assignment)

# Items 1-10 of the original plan (install, plugin skeleton, parsers, tests,
# single-LOOP tlm.txt, in-container microservice, plugin load, vault mount,
# e2e verify, harden/document) are DONE but built the WRONG collector model.
# This plan pivots to the production architecture above. The pure parsers in
# lib/loop_sources.py and their tests are reused as-is.
iteration_plan:
  - Strip the COSMOS demo — remove/disable INST, INST2, EXAMPLE, TEMPLATED targets so only GENO_LOOPS remains in the UI
  - Decommission the in-container LOOP_COLLECTOR microservice from plugin.txt (it cannot see host procs); keep lib/loop_sources.py parsers
  - Build the host-side sidecar — a python service on z2 that imports loop_sources, polls every interval, authenticates to COSMOS, and pushes telemetry via the JSON API; verify CLAUDE_PROCS is now nonzero and ALIVE is correct
  - Redefine telemetry as a pre-sized slot pool — replace the single LOOP packet with FLEET + LOOP_SLOT_1..32 in tlm.txt, each slot with AGE_MINUTES limits
  - Implement stable slot assignment in the sidecar — persist session_name→slot map so each loop keeps its slot; mark unoccupied slots OCCUPIED=0; unit-test the assignment logic
  - Rebuild and reload the plugin with the new packet definitions; confirm all ~21 loops appear across slots simultaneously
  - Ship a GENO_LOOPS Telemetry Viewer screen in the plugin (fleet summary + per-loop slot table with limits coloring)
  - Supervise the sidecar durably on z2 (systemd user unit preferred, or supervised tmux) so it restarts on failure and survives reconnects
  - End-to-end verify monitoring — Telemetry Viewer screen shows correct live fleet; kill a loop and watch its slot flip ALIVE=0 / AGE_MINUTES go RED
  - Phase 2 — define START_LOOP/STOP_LOOP/STEER_LOOP commands in the plugin and route them to the sidecar executor (tmux send-keys / SIGTERM / vault inbox note); verify a STOP from the UI actually stops a loop
  - Harden and document — README covers sidecar setup/supervision, the slot-pool model, command usage, and the security posture (HTTP/0.0.0.0 + password + tunnel)
